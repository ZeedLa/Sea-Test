<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лодка с коллизиями и точками интереса</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        canvas { display: block; }
        #info-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            max-width: 600px;
            text-align: center;
            display: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 10;
        }
        #info-panel img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        #info-panel h2 { margin: 0 0 8px 0; font-size: 1.5em; }
        #info-panel p { margin: 0; font-size: 1em; line-height: 1.4; }
        #controls-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            z-index: 10;
        }
    </style>
</head>
<body>
<div id="info-panel">
    <img id="point-image" src="" alt="">
    <h2 id="point-title"></h2>
    <p id="point-description"></p>
</div>
<div id="controls-hint">WASD – управление лодкой</div>

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// --- Инициализация сцены ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 8, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// --- HDRI окружение (опционально) ---
const rgbeLoader = new RGBELoader();
rgbeLoader.load('sunset.hdr', (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
    scene.background = texture;
}, undefined, () => {
    scene.background = new THREE.Color(0x87CEEB);
});

// --- Вспомогательный свет ---
const ambientLight = new THREE.AmbientLight(0x404060, 0.5);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// --- Переменные для объектов из bigmap ---
let waterPlane = null;       // прозрачный Plane
let landscape = null;        // суша
let colMeshes = [];          // заборы коллизий
let startPoint = null;       // точка спавна
let pointMeshes = [];        // сферы точек интереса
let boat = null;             // лодка (загружается отдельно)

// --- Параметры воды (raymarch) ---
let waterY = 0;              // уровень воды из bigmap

// --- Границы воды (из water Plane) ---
let waterBounds = { minX: -Infinity, maxX: Infinity, minZ: -Infinity, maxZ: Infinity };

// --- Данные точек интереса (заполните своими) ---
const pointsData = {
    Point1: {
        title: 'Бухта',
        description: 'Тихая бухта с кристально чистой водой. Идеальное место для рыбалки.',
        image: 'https://via.placeholder.com/400x200?text=Bay'
    },
    Point2: {
        title: 'Остров',
        description: 'Необитаемый остров с пальмами и белым песком.',
        image: 'https://via.placeholder.com/400x200?text=Island'
    },
    Point3: {
        title: 'Маяк',
        description: 'Старый маяк, построенный в XIX веке. Отсюда открывается великолепный вид.',
        image: 'https://via.placeholder.com/400x200?text=Lighthouse'
    },
    Point4: {
        title: 'Риф',
        description: 'Коралловый риф, населённый яркими тропическими рыбами.',
        image: 'https://via.placeholder.com/400x200?text=Reef'
    },
    Point5: {
        title: 'Пирс',
        description: 'Деревянный пирс, уходящий далеко в море. Популярное место для прогулок.',
        image: 'https://via.placeholder.com/400x200?text=Pier'
    },
    Point6: {
        title: 'Закат',
        description: 'Лучшее место, чтобы встретить закат. Романтическая атмосфера.',
        image: 'https://via.placeholder.com/400x200?text=Sunset'
    }
};

// --- Загрузка bigmap.glb ---
const loader = new GLTFLoader();
loader.load('bigmap.glb', (gltf) => {
    const root = gltf.scene;
    scene.add(root);

    // Ищем объекты по именам
    root.traverse((child) => {
        if (child.isMesh || child.isObject3D) {
            const name = child.name;
            if (name === 'water') {
                waterPlane = child;
                // Определяем уровень воды (y-координата центра)
                waterY = child.position.y;
                // Вычисляем границы по XZ (предполагаем PlaneGeometry с центром в позиции)
                if (child.geometry && child.geometry.type === 'PlaneGeometry') {
                    const geo = child.geometry;
                    const halfW = geo.parameters.width / 2 * child.scale.x;
                    const halfH = geo.parameters.height / 2 * child.scale.z;
                    waterBounds.minX = child.position.x - halfW;
                    waterBounds.maxX = child.position.x + halfW;
                    waterBounds.minZ = child.position.z - halfH;
                    waterBounds.maxZ = child.position.z + halfH;
                } else {
                    // fallback: используем bounding box
                    const box = new THREE.Box3().setFromObject(child);
                    waterBounds.minX = box.min.x;
                    waterBounds.maxX = box.max.x;
                    waterBounds.minZ = box.min.z;
                    waterBounds.maxZ = box.max.z;
                }
                // Делаем water невидимым (он только для границ)
                child.visible = false;
            } else if (name === 'Landscape') {
                landscape = child;
            } else if (name.startsWith('Col')) {
                colMeshes.push(child);
            } else if (name === 'Start') {
                startPoint = child;
                // Делаем невидимым
                child.visible = false;
            } else if (name.startsWith('Point')) {
                pointMeshes.push(child);
                // Делаем сферы невидимыми (они только для триггеров)
                child.visible = false;
            }
        }
    });

    // Если нашли Start – спавним лодку там
    if (startPoint && boat) {
        boat.position.copy(startPoint.position);
        boat.position.y = waterY + 0.2; // чуть выше воды
    }

    // Применяем envMap к ландшафту и лодке
    applyEnvMapToScene();
});

// --- Загрузка лодки (отдельно) ---
const boatLoader = new GLTFLoader();
boatLoader.load('boat.glb', (gltf) => {
    boat = gltf.scene;
    boat.scale.set(0.5, 0.5, 0.5);
    if (startPoint) {
        boat.position.copy(startPoint.position);
        boat.position.y = waterY + 0.2;
    } else {
        boat.position.set(0, waterY + 0.2, 0);
    }
    scene.add(boat);
    applyEnvMapToScene();
}, undefined, () => {
    // Если нет boat.glb – создаём procedural
    createProceduralBoat();
});

function createProceduralBoat() {
    const group = new THREE.Group();
    const hullGeo = new THREE.BoxGeometry(1.5, 0.4, 3);
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.5, metalness: 0.2 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.position.y = 0.2;
    group.add(hull);
    const deckGeo = new THREE.BoxGeometry(1.2, 0.1, 2.5);
    const deckMat = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 0.8 });
    const deck = new THREE.Mesh(deckGeo, deckMat);
    deck.position.set(0, 0.4, 0);
    group.add(deck);
    const mastGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5);
    const mastMat = new THREE.MeshStandardMaterial({ color: 0x654321 });
    const mast = new THREE.Mesh(mastGeo, mastMat);
    mast.position.set(0, 1.0, -0.5);
    group.add(mast);
    const sailGeo = new THREE.PlaneGeometry(0.8, 1.0);
    const sailMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide });
    const sail = new THREE.Mesh(sailGeo, sailMat);
    sail.position.set(0, 1.0, -0.5);
    sail.rotation.y = 0.2;
    group.add(sail);
    boat = group;
    if (startPoint) {
        boat.position.copy(startPoint.position);
        boat.position.y = waterY + 0.2;
    } else {
        boat.position.set(0, waterY + 0.2, 0);
    }
    scene.add(boat);
    applyEnvMapToScene();
}

function applyEnvMapToScene() {
    if (!scene.environment) return;
    const objects = [];
    if (landscape) objects.push(landscape);
    if (boat) objects.push(boat);
    objects.forEach(obj => {
        obj.traverse((child) => {
            if (child.isMesh) {
                child.material.envMap = scene.environment;
                child.material.envMapIntensity = 1.2;
                child.material.needsUpdate = true;
            }
        });
    });
}

// --- Raymarch вода ---
const seaUniforms = {
    uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    iTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
    uInvProjView: { value: new THREE.Matrix4() },
    uProjView: { value: new THREE.Matrix4() },
    uReflectionTex: { value: null },
    uWaterY: { value: waterY } // уровень воды
};

const seaVertexShader = `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
`;

const seaFragmentShader = `
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uRes;
    uniform float iTime;
    uniform vec3 uCamPos;
    uniform mat4 uInvProjView;
    uniform mat4 uProjView;
    uniform sampler2D uReflectionTex;
    uniform float uWaterY;

    // --- Шум и волны (из предыдущего кода) ---
    float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i);
        float b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0));
        float d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    float sea_octave(vec2 uv, float choppy) {
        uv += noise(uv);
        vec2 wv = 1.0 - abs(sin(uv));
        vec2 swv = abs(cos(uv));
        wv = mix(wv, swv, wv);
        return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
    }

    float map(vec3 p) {
        float freq = 0.16;
        float amp = 0.6;
        float choppy = 4.0;
        vec2 uv = p.xz * freq;
        float wave = 0.0;
        for (int i = 0; i < 5; i++) {
            wave += sea_octave(uv + iTime * 0.4, choppy) * amp;
            uv *= 2.0;
            amp *= 0.5;
            choppy = mix(choppy, 1.0, 0.2);
        }
        return p.y - (uWaterY + wave);
    }

    vec3 getSkyColor(vec3 dir) {
        float y = max(dir.y, 0.0);
        vec3 col = mix(vec3(0.3, 0.5, 0.8), vec3(0.9, 0.9, 0.9), pow(y, 0.5));
        vec3 sunDir = normalize(vec3(1.0, 0.5, 0.5));
        float sun = pow(max(dot(dir, sunDir), 0.0), 100.0);
        col += sun * vec3(1.0, 0.8, 0.5);
        return col;
    }

    vec3 getSeaColor(vec3 p, vec3 n, vec3 light, vec3 eye, vec3 dist) {
        float fresnel = 1.0 - max(dot(n, -eye), 0.0);
        fresnel = pow(fresnel, 3.0) * 0.5;
        vec3 reflected = getSkyColor(reflect(eye, n));
        vec3 refracted = vec3(0.02, 0.04, 0.06) + vec3(0.0, 0.1, 0.2) * (1.0 - fresnel);
        vec3 color = mix(refracted, reflected, fresnel);
        float spec = pow(max(dot(light, reflect(eye, n)), 0.0), 120.0);
        color += spec * vec3(1.0, 0.9, 0.7) * 0.6;
        float foam = smoothstep(0.7, 1.0, map(p));
        color = mix(color, vec3(1.0), foam * 0.3);
        return color;
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
        vec4 clipPos = vec4(uv * vec2(1.0, -1.0), -1.0, 1.0);
        vec4 viewPos = uInvProjView * clipPos;
        viewPos /= viewPos.w;
        vec3 ro = uCamPos;
        vec3 rd = normalize(viewPos.xyz - ro);

        float t = 0.0;
        float d = 0.0;
        vec3 p;
        for (int i = 0; i < 60; i++) {
            p = ro + rd * t;
            d = map(p);
            if (d < 0.001 || t > 50.0) break;
            t += d * 0.5;
        }

        vec3 color;
        if (d < 0.001) {
            vec2 eps = vec2(0.001, 0.0);
            vec3 n = normalize(vec3(
                map(p + eps.xyy) - map(p - eps.xyy),
                map(p + eps.yxy) - map(p - eps.yxy),
                map(p + eps.yyx) - map(p - eps.yyx)
            ));
            vec3 light = normalize(vec3(1.0, 0.5, 0.5));
            color = getSeaColor(p, n, light, rd, p - ro);

            // Отражение лодки
            if (rd.y < 0.0) {
                vec3 reflDir = reflect(rd, n);
                float distort = sea_octave(p.xz * 1.8, 1.0) * 0.03;
                vec2 reflUV = gl_FragCoord.xy / uRes;
                reflUV += distort * n.xz;
                vec3 reflColor = texture(uReflectionTex, reflUV).rgb;
                float spec = pow(max(0.0, dot(reflDir, light)), 24.0);
                reflColor += spec * 0.8;
                float fresnel = 1.0 - max(dot(n, -rd), 0.0);
                fresnel = pow(fresnel, 3.0) * 0.6;
                float blend = min(fresnel * 2.5, 0.9);
                color = mix(color, reflColor, blend);
            }
        } else {
            color = getSkyColor(rd);
        }

        color = mix(color, vec3(0.7, 0.8, 0.9), 1.0 - exp(-t * 0.01));
        gl_FragColor = vec4(color, 1.0);
    }
`;

const seaMaterial = new THREE.ShaderMaterial({
    uniforms: seaUniforms,
    vertexShader: seaVertexShader,
    fragmentShader: seaFragmentShader,
    side: THREE.DoubleSide,
    transparent: false,
});

const seaGeometry = new THREE.PlaneGeometry(60, 60);
const seaMesh = new THREE.Mesh(seaGeometry, seaMaterial);
seaMesh.rotation.x = -Math.PI / 2;
seaMesh.position.y = waterY;
scene.add(seaMesh);

// --- Отражение (render target) ---
const reflectionTarget = new THREE.WebGLRenderTarget(
    window.innerWidth * 0.5,
    window.innerHeight * 0.5,
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat }
);
const reflectionCamera = camera.clone();
reflectionCamera.matrixAutoUpdate = false;

// --- Управление лодкой ---
const keys = { w: false, a: false, s: false, d: false };
document.addEventListener('keydown', (e) => {
    if (e.key === 'w' || e.key === 'W') keys.w = true;
    if (e.key === 'a' || e.key === 'A') keys.a = true;
    if (e.key === 's' || e.key === 'S') keys.s = true;
    if (e.key === 'd' || e.key === 'D') keys.d = true;
});
document.addEventListener('keyup', (e) => {
    if (e.key === 'w' || e.key === 'W') keys.w = false;
    if (e.key === 'a' || e.key === 'A') keys.a = false;
    if (e.key === 's' || e.key === 'S') keys.s = false;
    if (e.key === 'd' || e.key === 'D') keys.d = false;
});

// --- Проверка коллизий с заборами ---
function checkCollision(position, radius = 0.6) {
    // Границы воды
    if (position.x < waterBounds.minX + radius || position.x > waterBounds.maxX - radius ||
        position.z < waterBounds.minZ + radius || position.z > waterBounds.maxZ - radius) {
        return true;
    }
    // Заборы (Col1-Col8)
    for (const col of colMeshes) {
        const box = new THREE.Box3().setFromObject(col);
        // Расширяем box на радиус лодки
        box.expandByScalar(radius);
        if (box.containsPoint(position)) {
            return true;
        }
    }
    return false;
}

// --- UI для точек интереса ---
const infoPanel = document.getElementById('info-panel');
const pointImage = document.getElementById('point-image');
const pointTitle = document.getElementById('point-title');
const pointDescription = document.getElementById('point-description');
let activePoint = null;
const TRIGGER_DISTANCE = 3.0;

function updatePointsUI(boatPos) {
    let closestPoint = null;
    let closestDist = Infinity;
    for (const point of pointMeshes) {
        const dist = boatPos.distanceTo(point.position);
        if (dist < TRIGGER_DISTANCE && dist < closestDist) {
            closestDist = dist;
            closestPoint = point;
        }
    }

    if (closestPoint !== activePoint) {
        activePoint = closestPoint;
        if (activePoint) {
            const data = pointsData[activePoint.name];
            if (data) {
                pointImage.src = data.image;
                pointTitle.textContent = data.title;
                pointDescription.textContent = data.description;
                infoPanel.style.display = 'block';
            } else {
                infoPanel.style.display = 'none';
            }
        } else {
            infoPanel.style.display = 'none';
        }
    }
}

// --- Камера, следующая за лодкой ---
function updateCamera() {
    if (!boat) return;
    const offset = new THREE.Vector3(0, 5, 8);
    const target = boat.position.clone();
    target.y += 1;
    camera.position.lerp(boat.position.clone().add(offset), 0.05);
    camera.lookAt(target);
}

// --- Анимация ---
let lastTime = 0;
function animate(time) {
    requestAnimationFrame(animate);
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    seaUniforms.iTime.value += dt;

    // --- Управление лодкой ---
    if (boat) {
        const speed = 3.0;
        const rotSpeed = 2.0;
        let move = new THREE.Vector3();
        if (keys.w) move.z -= speed * dt;
        if (keys.s) move.z += speed * dt;
        if (keys.a) boat.rotation.y += rotSpeed * dt;
        if (keys.d) boat.rotation.y -= rotSpeed * dt;

        // Преобразуем локальное движение в мировое
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(boat.quaternion);
        const worldMove = forward.multiplyScalar(-move.z); // т.к. move.z отрицательное вперёд
        // Добавляем боковое движение (если нужно)
        // Пока только вперёд/назад

        const newPos = boat.position.clone().add(worldMove);
        // Проверка коллизий
        if (!checkCollision(newPos)) {
            boat.position.copy(newPos);
        }

        // Качание на волнах (синхронизировано с шейдером)
        const wave = Math.sin(time * 0.003 + boat.position.x * 0.5 + boat.position.z * 0.5) * 0.05;
        boat.position.y = waterY + 0.2 + wave;
        boat.rotation.x = Math.sin(time * 0.002 + boat.position.x) * 0.02;
        boat.rotation.z = Math.cos(time * 0.0025 + boat.position.z) * 0.03;

        // Обновление UI точек
        updatePointsUI(boat.position);
    }

    // --- Рендер отражения ---
    if (boat) {
        const savedBoatY = boat.position.y;
        const savedBoatRot = boat.rotation.clone();

        boat.position.y = waterY - (savedBoatY - waterY);
        boat.rotation.x = -savedBoatRot.x;
        boat.rotation.z = -savedBoatRot.z;

        const camPos = camera.position.clone();
        reflectionCamera.position.set(camPos.x, waterY - (camPos.y - waterY), camPos.z);
        reflectionCamera.rotation.copy(camera.rotation);
        reflectionCamera.rotation.x = -reflectionCamera.rotation.x;
        reflectionCamera.updateMatrixWorld(true);

        const waterVisible = seaMesh.visible;
        seaMesh.visible = false;
        renderer.setRenderTarget(reflectionTarget);
        renderer.render(scene, reflectionCamera);
        renderer.setRenderTarget(null);
        seaMesh.visible = waterVisible;

        boat.position.y = savedBoatY;
        boat.rotation.copy(savedBoatRot);
    }

    // --- Обновление uniform'ов воды ---
    seaUniforms.uCamPos.value.copy(camera.position);
    seaUniforms.uProjView.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    seaUniforms.uInvProjView.value.copy(seaUniforms.uProjView.value).invert();
    seaUniforms.uReflectionTex.value = reflectionTarget.texture;
    seaUniforms.uWaterY.value = waterY;

    // --- Камера следует за лодкой ---
    updateCamera();

    // --- Рендер основной сцены ---
    renderer.render(scene, camera);
}

animate(0);

// --- Resize ---
window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    seaUniforms.uRes.value.set(w, h);
    reflectionTarget.setSize(w * 0.5, h * 0.5);
});
</script>
</body>
</html>
