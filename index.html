<!-- ============ SEA (raymarch) — RawShaderMaterial, GLSL3, пишет gl_FragDepth ============ -->
<script id="sea-vert" type="x-shader/x-vertex">
in vec3 position;
void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
</script>
<script id="sea-frag" type="x-shader/x-fragment">
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float iTime;
uniform vec3 uCamPos;
uniform mat4 uInvProjView;
uniform mat4 uProjView;
uniform float uSeaLevel;               // <-- уровень воды (высота Plane "water")

/* ===== Seascape by Alexander Alekseev aka TDM (2014), CC BY-NC-SA 3.0 ===== */
const int NUM_STEPS = 32;
const float PI = 3.141592;
const float EPSILON = 1e-3;
#define EPSILON_NRM (0.1 / uRes.x)
const int ITER_GEOMETRY = 3;
const int ITER_FRAGMENT = 5;
const float SEA_HEIGHT = 0.6;
const float SEA_CHOPPY = 4.0;
const float SEA_SPEED = 0.8;
const float SEA_FREQ = 0.16;
const vec3 SEA_BASE = vec3(0.0, 0.09, 0.18);
const vec3 SEA_WATER_COLOR = vec3(0.8, 0.9, 0.6) * 0.6;
#define SEA_TIME (1.0 + iTime * SEA_SPEED)
const mat2 octave_m = mat2(1.6, 1.2, -1.2, 1.6);

float hash(vec2 p) { float h = dot(p, vec2(127.1, 311.7)); return fract(sin(h) * 43758.5453123); }
float noise(in vec2 p) {
  vec2 i = floor(p); vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return -1.0 + 2.0 * mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float diffuse(vec3 n, vec3 l, float p) { return pow(dot(n, l) * 0.4 + 0.6, p); }
float specular(vec3 n, vec3 l, vec3 e, float s) {
  float nrm = (s + 8.0) / (PI * 8.0);
  return pow(max(dot(reflect(e, n), l), 0.0), s) * nrm;
}
vec3 getSkyColor(vec3 e) {
  e.y = (max(e.y, 0.0) * 0.8 + 0.2) * 0.8;
  return vec3(pow(1.0 - e.y, 2.0), 1.0 - e.y, 0.6 + (1.0 - e.y) * 0.4) * 1.1;
}
float sea_octave(vec2 uv, float choppy) {
  uv += noise(uv);
  vec2 wv = 1.0 - abs(sin(uv));
  vec2 swv = abs(cos(uv));
  wv = mix(wv, swv, wv);
  return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
}
float map(vec3 p) {
  float freq = SEA_FREQ, amp = SEA_HEIGHT, choppy = SEA_CHOPPY;
  vec2 uv = p.xz; uv.x *= 0.75;
  float d, h = 0.0;
  for (int i = 0; i < ITER_GEOMETRY; i++) {
    d = sea_octave((uv + SEA_TIME) * freq, choppy);
    d += sea_octave((uv - SEA_TIME) * freq, choppy);
    h += d * amp;
    uv *= octave_m; freq *= 1.9; amp *= 0.22; choppy = mix(choppy, 1.0, 0.2);
  }
  return p.y - uSeaLevel - h;          // волны вокруг уровня uSeaLevel
}
float map_detailed(vec3 p) {
  float freq = SEA_FREQ, amp = SEA_HEIGHT, choppy = SEA_CHOPPY;
  vec2 uv = p.xz; uv.x *= 0.75;
  float d, h = 0.0;
  for (int i = 0; i < ITER_FRAGMENT; i++) {
    d = sea_octave((uv + SEA_TIME) * freq, choppy);
    d += sea_octave((uv - SEA_TIME) * freq, choppy);
    h += d * amp;
    uv *= octave_m; freq *= 1.9; amp *= 0.22; choppy = mix(choppy, 1.0, 0.2);
  }
  return p.y - uSeaLevel - h;
}
vec3 getSeaColor(vec3 p, vec3 n, vec3 l, vec3 eye, vec3 dist) {
  float fresnel = clamp(1.0 - dot(n, -eye), 0.0, 1.0);
  fresnel = min(fresnel * fresnel * fresnel, 0.5);
  vec3 reflected = getSkyColor(reflect(eye, n));
  vec3 refracted = SEA_BASE + diffuse(n, l, 80.0) * SEA_WATER_COLOR * 0.12;
  vec3 color = mix(refracted, reflected, fresnel);
  float atten = max(1.0 - dot(dist, dist) * 0.001, 0.0);
  color += SEA_WATER_COLOR * (p.y - uSeaLevel) * 0.18 * atten;
  color += specular(n, l, eye, 60.0);
  return color;
}
vec3 getNormal(vec3 p, float eps) {
  vec3 n;
  n.y = map_detailed(p);
  n.x = map_detailed(vec3(p.x + eps, p.y, p.z)) - n.y;
  n.z = map_detailed(vec3(p.x, p.y, p.z + eps)) - n.y;
  n.y = eps;
  return normalize(n);
}
float heightMapTracing(vec3 ori, vec3 dir, out vec3 p) {
  float tm = 0.0, tx = 1000.0;
  float hx = map(ori + dir * tx);
  if (hx > 0.0) { p = ori + dir * tx; return tx; }
  float hm = map(ori);
  for (int i = 0; i < NUM_STEPS; i++) {
    float tmid = mix(tm, tx, hm / (hm - hx));
    p = ori + dir * tmid;
    float hmid = map(p);
    if (hmid < 0.0) { tx = tmid; hx = hmid; } else { tm = tmid; hm = hmid; }
    if (abs(hmid) < EPSILON) break;
  }
  return mix(tm, tx, hm / (hm - hx));
}
void main() {
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  vec4 wp = uInvProjView * vec4(ndc, 1.0, 1.0);
  vec3 farP = wp.xyz / wp.w;
  vec3 ori = uCamPos;
  vec3 dir = normalize(farP - ori);
  vec3 p;
  heightMapTracing(ori, dir, p);
  vec3 dist = p - ori;
  vec3 n = getNormal(p, dot(dist, dist) * EPSILON_NRM);
  vec3 light = normalize(vec3(0.0, 1.0, 0.8));
  vec3 color = mix(getSkyColor(dir),
                   getSeaColor(p, n, light, dir, dist),
                   pow(smoothstep(0.0, -0.02, dir.y), 0.2));
  float depth = 1.0;
  if (dir.y < 0.0) {
    vec4 c = uProjView * vec4(p, 1.0);
    depth = (c.z / c.w) * 0.5 + 0.5;
  }
  gl_FragDepth = clamp(depth, 0.0, 1.0);
  outColor = vec4(pow(color, vec3(0.65)), 1.0);
}
</script>

<!-- ============ FOAM WAKE ============ -->
<script id="foam-vert" type="x-shader/x-vertex">
attribute vec2 aData;
varying vec2 vData;
varying vec3 vWorld;
void main() {
  vData = aData;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorld = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
</script>
<script id="foam-frag" type="x-shader/x-fragment">
precision highp float;
varying vec2 vData;
varying vec3 vWorld;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.55;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p = p * 2.02 + 1.7; a *= 0.5; }
  return v;
}
void main() {
  float u = vData.x;
  float age = vData.y;
  float n = fbm(vWorld.xz * 1.7 + vec2(0.0, age * 1.5));
  n += 0.35 * fbm(vWorld.xz * 5.0 - vec2(age * 3.0, 0.0));
  float thr = mix(0.30, 0.72, age);
  float churn = smoothstep(thr, thr + 0.30, n);
  float edge = smoothstep(0.55, 0.98, abs(u)) * (1.0 - smoothstep(0.0, 0.7, age));
  float sideSoft = 1.0 - smoothstep(0.82, 1.0, abs(u));
  float ageFade = smoothstep(0.0, 0.06, age) * pow(1.0 - age, 1.25);
  float foam = clamp(churn * 0.85 + edge, 0.0, 1.0);
  float alpha = foam * sideSoft * ageFade * 0.9;
  if (alpha < 0.01) discard;
  vec3 col = mix(vec3(0.72, 0.83, 0.93), vec3(1.0), churn);
  gl_FragColor = vec4(col, alpha);
}
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

/* ------------------------------ настройки ------------------------------ */
const GLB_URL        = 'yacht.glb';   // модель лодки (иначе — процедурная)
const BIGMAP_URL     = 'bigmap.glb';  // карта: water, Landscape, ColN, Start, PointN
const GLB_TARGET_LENGTH = 12.6;
const GLB_YAW_OFFSET = 0.0;
const QUALITY        = 0.9;

const BOAT_RADIUS    = 1.1;           // "габарит" лодки для коллизий (в метрах сцены)
const BOAT_WATER_OFFSET = 0.05;       // насколько приподнять лодку над волной
const POI_RADIUS     = 7.0;           // радиус срабатывания точки интереса

/* Описания точек. Ключ — имя объекта в glb строчными буквами.
   Замените img/title/text на свои. */
const POI_DATA = {
  point1: { title:'Старый маяк',   text:'Описание точки 1. Замените текст и фото в объекте POI_DATA.', img:'photos/point1.jpg' },
  point2: { title:'Рыбацкая бухта',text:'Описание точки 2. Замените текст и фото в объекте POI_DATA.', img:'photos/point2.jpg' },
  point3: { title:'Крепость',      text:'Описание точки 3. Замените текст и фото в объекте POI_DATA.', img:'photos/point3.jpg' },
  point4: { title:'Причал',        text:'Описание точки 4. Замените текст и фото в объекте POI_DATA.', img:'photos/point4.jpg' },
  point5: { title:'Лагуна',        text:'Описание точки 5. Замените текст и фото в объекте POI_DATA.', img:'photos/point5.jpg' },
  point6: { title:'Скалы',         text:'Описание точки 6. Замените текст и фото в объекте POI_DATA.', img:'photos/point6.jpg' },
};

/* ------------------------------ рендерер ------------------------------ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * QUALITY);
renderer.autoClear = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 3000);

/* ------------------------------ состояние карты ------------------------------ */
let seaLevel = 0;                 // высота воды (из Plane "water")
let bounds = null;                // {minX,maxX,minZ,maxZ} — зона плавания
const spawn = { x:0, z:0, heading:0 };
const colliders = [];             // {box, mat, inv, rLocal}
const pois = [];                  // {name,x,z,marker,phase,data}
let activePoi = null;
let gTime = 0;

/* ------------------------------ окружение / свет ------------------------------ */
function applyEnvMapToBoat() {
  if (!scene.environment || !boat) return;
  boat.traverse(child => {
    if (child.isMesh) {
      child.material.envMap = scene.environment;
      child.material.envMapIntensity = 1.2;
      child.material.metalness = 0.7;
      child.material.roughness = 0.3;
      child.material.needsUpdate = true;
    }
  });
}
const rgbeLoader = new RGBELoader();
rgbeLoader.load('sunset.hdr', tex => {
  tex.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = tex;
  applyEnvMapToBoat();
}, undefined, err => console.warn('[HDRI] sunset.hdr не найден — отражения отключены.', err));

const sunDir = new THREE.Vector3(0, 1, 0.8).normalize();
const sun = new THREE.DirectionalLight(0xfff4e2, 2.1);
sun.position.copy(sunDir).multiplyScalar(50);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x21506b, 0.9));
scene.add(new THREE.AmbientLight(0x35506a, 0.5));

/* ------------------------------ море ------------------------------ */
const seaUniforms = {
  uRes:        { value: new THREE.Vector2() },
  iTime:       { value: 0 },
  uCamPos:     { value: new THREE.Vector3() },
  uInvProjView:{ value: new THREE.Matrix4() },
  uProjView:   { value: new THREE.Matrix4() },
  uSeaLevel:   { value: 0 },
};
const seaMat = new THREE.RawShaderMaterial({
  glslVersion: THREE.GLSL3,
  vertexShader: document.getElementById('sea-vert').textContent,
  fragmentShader: document.getElementById('sea-frag').textContent,
  uniforms: seaUniforms,
  depthTest: true, depthWrite: true,
});
const seaMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), seaMat);
seaMesh.frustumCulled = false;
seaMesh.renderOrder = -1;
scene.add(seaMesh);

/* -------- JS-копия шейдерной функции высоты волны (+ seaLevel) -------- */
const fract = x => x - Math.floor(x);
function hashJS(x, y){ return fract(Math.sin(x*127.1 + y*311.7) * 43758.5453123); }
function noiseJS(x, y){
  const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=hashJS(ix,iy), b=hashJS(ix+1,iy), c=hashJS(ix,iy+1), d=hashJS(ix+1,iy+1);
  const bx=a+(b-a)*ux, tx=c+(d-c)*ux;
  return -1 + 2*(bx + (tx-bx)*uy);
}
function seaOctave(ux, uy, choppy){
  const n = noiseJS(ux, uy); ux += n; uy += n;
  let wx = 1-Math.abs(Math.sin(ux)), wy = 1-Math.abs(Math.sin(uy));
  const sx = Math.abs(Math.cos(ux)), sy = Math.abs(Math.cos(uy));
  wx += (sx-wx)*wx; wy += (sy-wy)*wy;
  return Math.pow(1-Math.pow(wx*wy, 0.65), choppy);
}
function seaHeightJS(x, z, time){
  const SEA_TIME = 1 + time*0.8;
  let freq=0.16, amp=0.6, choppy=4.0, ux=x*0.75, uz=z, h=0;
  for (let i=0;i<3;i++){
    let d = seaOctave((ux+SEA_TIME)*freq,(uz+SEA_TIME)*freq,choppy);
    d += seaOctave((ux-SEA_TIME)*freq,(uz-SEA_TIME)*freq,choppy);
    h += d*amp;
    const nx=1.6*ux+1.2*uz, nz=-1.2*ux+1.6*uz;
    ux=nx; uz=nz; freq*=1.9; amp*=0.22; choppy += (1-choppy)*0.2;
  }
  return seaLevel + h;   // абсолютная высота с учётом уровня карты
}

/* ------------------------------ лодка: процедурная запасная ------------------------------ */
function buildProceduralBoat(){
  const g = new THREE.Group();
  const white  = new THREE.MeshStandardMaterial({ color:0xeef2f6, roughness:.5, metalness:.05 });
  const red    = new THREE.MeshStandardMaterial({ color:0xb01f22, roughness:.5 });
  const teak   = new THREE.MeshStandardMaterial({ color:0x8a6a3f, roughness:.7 });
  const cabinM = new THREE.MeshStandardMaterial({ color:0xd8dee6, roughness:.4, metalness:.1 });
  const spar   = new THREE.MeshStandardMaterial({ color:0x5b3f22, roughness:.6 });
  const sailM  = new THREE.MeshStandardMaterial({ color:0xf3f2ec, roughness:.85, side:THREE.DoubleSide });

  const hull = new THREE.Mesh(new THREE.SphereGeometry(1,40,28), white);
  hull.scale.set(0.5,0.42,1.75); g.add(hull);
  const boot = new THREE.Mesh(new THREE.SphereGeometry(1.005,40,10,0,Math.PI*2,Math.PI*0.42,Math.PI*0.16), red);
  boot.scale.set(0.5,0.42,1.75); g.add(boot);
  const deck = new THREE.Mesh(new THREE.CapsuleGeometry(0.34,2.6,4,16), teak);
  deck.rotation.x = Math.PI/2; deck.position.y = 0.14; deck.scale.set(1.25,1,0.62); g.add(deck);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.34,1.1), cabinM);
  cabin.position.set(0,0.32,-0.55); g.add(cabin);

  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.045,2.0,12), spar);
  mast.position.set(0,1.05,0.1); g.add(mast);
  const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.7,10), spar);
  boom.rotation.x = Math.PI/2; boom.position.set(0,0.42,-0.35); g.add(boom);

  const mainGeo = new THREE.PlaneGeometry(1.1,1.5,12,12);
  const mp = mainGeo.attributes.position;
  for (let i=0;i<mp.count;i++){
    const y=mp.getY(i), x=mp.getX(i);
    const t=THREE.MathUtils.clamp((y+0.75)/1.5,0,1);
    mp.setZ(i, 0.28*(1-Math.pow(x/0.55,2))*(0.6+0.4*t));
  }
  mainGeo.computeVertexNormals();
  const mainsail = new THREE.Mesh(mainGeo, sailM);
  mainsail.rotation.y = Math.PI/2; mainsail.position.set(0,1.0,-0.3); g.add(mainsail);

  const jib = new THREE.Mesh(new THREE.PlaneGeometry(0.8,1.0), sailM);
  jib.rotation.y = Math.PI/2; jib.position.set(0,0.75,0.6); g.add(jib);
  return g;
}
let boat = buildProceduralBoat();
scene.add(boat);

const modelInfo = document.getElementById('model');
let infoBoat = 'процедурная', infoMap = 'нет';
const updateInfo = () => modelInfo.innerHTML = `лодка: <b>${infoBoat}</b> · карта: <b>${infoMap}</b>`;
updateInfo();

/* ------------------------------ загрузка yacht.glb ------------------------------ */
(function tryLoadGLB(){
  new GLTFLoader().load(GLB_URL, gltf => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    const maxAxis = Math.max(size.x,size.y,size.z) || 1;
    model.position.sub(center);
    const wrap = new THREE.Group();
    wrap.add(model);
    wrap.scale.setScalar(GLB_TARGET_LENGTH / maxAxis);
    wrap.rotation.y = GLB_YAW_OFFSET;
    const box2 = new THREE.Box3().setFromObject(wrap);
    wrap.position.y -= box2.min.y + 0.12;
    scene.remove(boat);
    boat = wrap;
    scene.add(boat);
    applyEnvMapToBoat();
    infoBoat = 'yacht.glb ✓'; updateInfo();
  }, undefined, () => console.log('[yacht] yacht.glb не найден — процедурная модель.'));
})();

/* ------------------------------ загрузка bigmap.glb ------------------------------ */
function computeLocalBox(root){
  // бокс содержимого root в его собственных локальных координатах
  const box = new THREE.Box3(), tmp = new THREE.Box3(), m = new THREE.Matrix4();
  const rootInv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  root.traverse(o => {
    if (o.isMesh && o.geometry){
      o.geometry.computeBoundingBox();
      if (!o.geometry.boundingBox) return;
      tmp.copy(o.geometry.boundingBox);
      m.copy(rootInv).multiply(o.matrixWorld);
      tmp.applyMatrix4(m);
      box.union(tmp);
    }
  });
  return box;
}

function placeholderImg(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4d73"/><stop offset="1" stop-color="#0a2236"/>
    </linearGradient></defs>
    <rect width="640" height="360" fill="url(#g)"/>
    <text x="50%" y="52%" fill="#9fd3ff" font-family="sans-serif" font-size="26"
      text-anchor="middle">${label.replace(/[<>&]/g,'')}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

const markerGeo = new THREE.SphereGeometry(0.38, 18, 14);

(function loadBigMap(){
  new GLTFLoader().load(BIGMAP_URL, gltf => {
    const model = gltf.scene;
    scene.add(model);
    model.updateMatrixWorld(true);

    const _v = new THREE.Vector3();

    model.traverse(o => {
      const name = (o.name || '').trim();
      if (!name) return;
      const lower = name.toLowerCase();

      /* --- water: уровень моря + граница акватории --- */
      if (lower === 'water'){
        const b = new THREE.Box3().setFromObject(o);
        seaLevel = (b.min.y + b.max.y) / 2;
        seaUniforms.uSeaLevel.value = seaLevel;
        bounds = { minX:b.min.x, maxX:b.max.x, minZ:b.min.z, maxZ:b.max.z };
        o.visible = false;   // рисуем свою raymarch-воду на этой высоте
      }

      /* --- ColN: заборы коллизий --- */
      else if (/^col\d+$/.test(lower)){
        o.visible = false;
        const sx = new THREE.Vector3().setFromMatrixColumn(o.matrixWorld,0).length();
        const sz = new THREE.Vector3().setFromMatrixColumn(o.matrixWorld,2).length();
        colliders.push({
          box: computeLocalBox(o),
          mat: o.matrixWorld.clone(),
          inv: new THREE.Matrix4().copy(o.matrixWorld).invert(),
          rLocal: BOAT_RADIUS / Math.max(1e-4, (sx+sz)*0.5),
        });
      }

      /* --- Start: точка спавна --- */
      else if (lower === 'start'){
        o.visible = false;
        o.getWorldPosition(_v);
        spawn.x = _v.x; spawn.z = _v.z;
        spawn.heading = new THREE.Euler().setFromQuaternion(o.quaternion,'YXZ').y;
        respawn();
      }

      /* --- PointN: точки интереса --- */
      else if (/^point\d+$/.test(lower)){
        o.visible = false;
        o.getWorldPosition(_v);
        const data = POI_DATA[lower] || { title:name, text:'Добавьте описание в POI_DATA.', img:'' };
        const marker = new THREE.Mesh(markerGeo,
          new THREE.MeshStandardMaterial({ color:0xffa640, emissive:0xff7711,
            emissiveIntensity:0.9, roughness:0.4 }));
        marker.position.set(_v.x, seaLevel + 1.1, _v.z);
        scene.add(marker);
        pois.push({ key:lower, x:_v.x, z:_v.z, marker, phase:Math.random()*6.283, data });
      }
      /* Landscape остаётся видимым как есть */
    });

    infoMap = 'bigmap.glb ✓'; updateInfo();
    console.log('[map] bigmap.glb загружен. seaLevel =', seaLevel,
      '| коллизий:', colliders.length, '| точек:', pois.length);
  }, undefined, err => {
    console.warn('[map] bigmap.glb не найден — карта не загружена.', err);
    infoMap = 'не найдена ✗'; updateInfo();
  });
})();

/* ------------------------------ спавн / сброс ------------------------------ */
function respawn(){
  B.x = spawn.x; B.z = spawn.z;
  B.heading = spawn.heading; B.speed = 0;
  B.renderY = seaHeightJS(B.x, B.z, gTime);
  B.pitch = 0; B.roll = 0;
  wake.length = 0;
  lastSampleX = B.x; lastSampleZ = B.z;
}

/* ------------------------------ кильватерный след ------------------------------ */
const NSEG = 200, SAMPLE_STEP = 0.22, WAKE_LIFE = 4.0;
const wakePos  = new Float32Array(NSEG*2*3);
const wakeData = new Float32Array(NSEG*2*2);
const wakeIdx  = new Uint32Array((NSEG-1)*6);
for (let i=0;i<NSEG-1;i++){
  const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3,o=i*6;
  wakeIdx[o]=a; wakeIdx[o+1]=b; wakeIdx[o+2]=c;
  wakeIdx[o+3]=b; wakeIdx[o+4]=d; wakeIdx[o+5]=c;
}
const wakeGeo = new THREE.BufferGeometry();
wakeGeo.setAttribute('position', new THREE.BufferAttribute(wakePos,3).setUsage(THREE.DynamicDrawUsage));
wakeGeo.setAttribute('aData',    new THREE.BufferAttribute(wakeData,2).setUsage(THREE.DynamicDrawUsage));
wakeGeo.setIndex(new THREE.BufferAttribute(wakeIdx,1));
const foamMat = new THREE.ShaderMaterial({
  vertexShader: document.getElementById('foam-vert').textContent,
  fragmentShader: document.getElementById('foam-frag').textContent,
  transparent:true, depthWrite:false, depthTest:true,
  side:THREE.DoubleSide, blending:THREE.NormalBlending,
});
const foam = new THREE.Mesh(wakeGeo, foamMat);
foam.frustumCulled = false; foam.renderOrder = 1;
scene.add(foam);
let wake = [], lastSampleX = 0, lastSampleZ = 0;

/* ------------------------------ управление ------------------------------ */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR') respawn();
});
addEventListener('keyup', e => keys[e.code] = false);

let dragging=false, lastX=0, lastY=0, camYaw=0, camPitch=0.32, camDist=9.0;
canvas.addEventListener('mousedown', e => { dragging=true; lastX=e.clientX; lastY=e.clientY; });
addEventListener('mouseup', () => dragging=false);
addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX-lastX)*0.005;
  camPitch = Math.min(1.15, Math.max(-0.1, camPitch + (e.clientY-lastY)*0.004));
  lastX=e.clientX; lastY=e.clientY;
});
canvas.addEventListener('wheel', e => {
  camDist = Math.min(20, Math.max(4, camDist + e.deltaY*0.01));
  e.preventDefault();
}, { passive:false });

/* ------------------------------ состояние лодки ------------------------------ */
const B = { x:0, z:0, heading:0, speed:0, renderY:0, pitch:0, roll:0 };
const spdEl = document.getElementById('spd');
const camPos = new THREE.Vector3(0,5,10);
let camInit = false;
const damp = (cur,target,dt,tau) => cur + (target-cur)*(1-Math.exp(-dt/tau));

/* ------------------------------ коллизии и границы ------------------------------ */
function clampToWater(){
  if (!bounds) return;
  const M = BOAT_RADIUS + 0.4;
  const nx = THREE.MathUtils.clamp(B.x, bounds.minX + M, bounds.maxX - M);
  const nz = THREE.MathUtils.clamp(B.z, bounds.minZ + M, bounds.maxZ - M);
  if (nx !== B.x || nz !== B.z){ B.x = nx; B.z = nz; B.speed *= 0.9; }
}

const _lp = new THREE.Vector3();
function resolveCollisions(){
  for (const c of colliders){
    _lp.set(B.x, B.renderY, B.z).applyMatrix4(c.inv); // в локальные координаты забора
    const b = c.box, r = c.rLocal;
    if (_lp.x > b.min.x - r && _lp.x < b.max.x + r &&
        _lp.z > b.min.z - r && _lp.z < b.max.z + r){
      const dx1 = _lp.x - (b.min.x - r), dx2 = (b.max.x + r) - _lp.x;
      const dz1 = _lp.z - (b.min.z - r), dz2 = (b.max.z + r) - _lp.z;
      const m = Math.min(dx1,dx2,dz1,dz2);
      if      (m === dx1) _lp.x = b.min.x - r;
      else if (m === dx2) _lp.x = b.max.x + r;
      else if (m === dz1) _lp.z = b.min.z - r;
      else                _lp.z = b.max.z + r;
      _lp.applyMatrix4(c.mat);       // обратно в мир
      B.x = _lp.x; B.z = _lp.z;
      B.speed *= 0.55;               // удар о забор гасит скорость
    }
  }
}

/* ------------------------------ карточка POI ------------------------------ */
const poiEl = document.getElementById('poi');
const poiImg = document.getElementById('poi-img');
const poiTitle = document.getElementById('poi-title');
const poiText = document.getElementById('poi-text');

function renderPoiCard(){
  if (!activePoi){ poiEl.classList.remove('show'); return; }
  const d = activePoi.data;
  poiTitle.textContent = d.title;
  poiText.textContent = d.text;
  poiImg.onerror = () => { poiImg.onerror = null; poiImg.src = placeholderImg(d.title); };
  poiImg.src = d.img || placeholderImg(d.title);
  poiEl.classList.add('show');
}
function updatePOI(){
  let best = null, bestD = Infinity;
  for (const p of pois){
    const d = Math.hypot(B.x - p.x, B.z - p.z);
    const limit = (p === activePoi) ? POI_RADIUS * 1.35 : POI_RADIUS; // гистерезис
    if (d < limit && d < bestD){ best = p; bestD = d; }
  }
  if (best !== activePoi){ activePoi = best; renderPoiCard(); }
}

/* ------------------------------ resize ------------------------------ */
function resize(){
  const w=innerWidth, h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  seaUniforms.uRes.value.set(canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

/* ------------------------------ главный цикл ------------------------------ */
const _pv = new THREE.Matrix4();
let t0 = performance.now(), last = t0;

function frame(now){
  const time = (now - t0)/1000;
  gTime = time;
  let dt = Math.min((now - last)/1000, 0.05);
  last = now;

  /* --- физика --- */
  const turn=1.35, accel=3.0, maxFwd=7.0, maxRev=2.5;
  if (keys['ArrowLeft']||keys['KeyA']) B.heading += turn*dt;
  if (keys['ArrowRight']||keys['KeyD']) B.heading -= turn*dt;
  if (keys['ArrowUp']||keys['KeyW']) B.speed += accel*dt;
  else if (keys['ArrowDown']||keys['KeyS']) B.speed -= accel*dt;
  else B.speed *= (1 - 1.1*dt);
  B.speed = Math.min(maxFwd, Math.max(-maxRev, B.speed));
  B.x += Math.sin(B.heading)*B.speed*dt;
  B.z += Math.cos(B.heading)*B.speed*dt;

  /* --- ограничения карты --- */
  clampToWater();
  resolveCollisions();

  /* --- качка на волнах --- */
  const e = 1;
  const hC = seaHeightJS(B.x, B.z, time);
  const hF = seaHeightJS(B.x + Math.sin(B.heading)*e, B.z + Math.cos(B.heading)*e, time);
  const hB = seaHeightJS(B.x - Math.sin(B.heading)*e, B.z - Math.cos(B.heading)*e, time);
  const rX = Math.cos(B.heading), rZ = -Math.sin(B.heading);
  const hR = seaHeightJS(B.x + rX*e, B.z + rZ*e, time);
  const hL = seaHeightJS(B.x - rX*e, B.z - rZ*e, time);
  const targetY = (hC + (hF+hB+hR+hL)*0.25)*0.5;
  const targetPitch = Math.atan2(hB - hF, 2*e);
  const targetRoll  = Math.atan2(hR - hL, 2*e);
  B.renderY = damp(B.renderY, targetY, dt, 2.06);
  B.pitch   = damp(B.pitch, targetPitch, dt, 2.08);
  B.roll    = damp(B.roll,  targetRoll,  dt, 2.08);

  const bob = Math.sin(time*1.1)*0.005;
  boat.position.set(B.x, B.renderY + BOAT_WATER_OFFSET + bob, B.z);
  boat.rotation.set(0,0,0);
  boat.rotation.order = 'YXZ';
  boat.rotation.y = B.heading;
  boat.rotation.x = B.pitch;
  boat.rotation.z = B.roll;

  /* --- кильватерный след --- */
  const spd = Math.abs(B.speed);
  const sternX = B.x - Math.sin(B.heading)*1.55;
  const sternZ = B.z - Math.cos(B.heading)*1.55;
  if (spd > 0.4){
    const ddx = sternX-lastSampleX, ddz = sternZ-lastSampleZ;
    if (ddx*ddx + ddz*ddz > SAMPLE_STEP*SAMPLE_STEP){
      wake.push({ x:sternX, z:sternZ, px:rX, pz:rZ, age:0 });
      lastSampleX = sternX; lastSampleZ = sternZ;
      if (wake.length > NSEG) wake.shift();
    }
  }
  for (let i=0;i<wake.length;i++) wake[i].age += dt/WAKE_LIFE;
  while (wake.length && wake[0].age >= 1) wake.shift();
  const count = wake.length;
  for (let i=0;i<count;i++){
    const sm = wake[i];
    const hw = 0.30 + sm.age*2.4;
    const lx = sm.x - sm.px*hw, lz = sm.z - sm.pz*hw;
    const rx = sm.x + sm.px*hw, rz = sm.z + sm.pz*hw;
    const li=(i*2)*3, ri=(i*2+1)*3;
    wakePos[li]=lx;   wakePos[li+1]=seaHeightJS(lx,lz,time)+0.05; wakePos[li+2]=lz;
    wakePos[ri]=rx;   wakePos[ri+1]=seaHeightJS(rx,rz,time)+0.05; wakePos[ri+2]=rz;
    const ld=(i*2)*2, rd=(i*2+1)*2;
    wakeData[ld]=-1; wakeData[ld+1]=sm.age;
    wakeData[rd]= 1; wakeData[rd+1]=sm.age;
  }
  wakeGeo.attributes.position.needsUpdate = true;
  wakeGeo.attributes.aData.needsUpdate = true;
  wakeGeo.setDrawRange(0, Math.max(0, count-1)*6);

  /* --- буи-маркеры точек --- */
  for (const p of pois){
    p.marker.position.set(p.x,
      seaLevel + 1.1 + Math.sin(time*1.6 + p.phase)*0.18, p.z);
    const s = (p === activePoi) ? 1.5 : 1.0;
    p.marker.scale.setScalar(damp(p.marker.scale.x, s, dt, 0.15));
  }
  updatePOI();

  /* --- камера --- */
  const tx=B.x, ty=B.renderY+0.55, tz=B.z;
  const yaw = B.heading + Math.PI + camYaw;
  const cp = Math.cos(camPitch);
  const desired = new THREE.Vector3(
    tx + Math.sin(yaw)*cp*camDist,
    ty + Math.sin(camPitch)*camDist + 0.6,
    tz + Math.cos(yaw)*cp*camDist);
  if (!camInit){ camPos.copy(desired); camInit = true; }
  camPos.x = damp(camPos.x, desired.x, dt, 0.14);
  camPos.y = damp(camPos.y, desired.y, dt, 0.14);
  camPos.z = damp(camPos.z, desired.z, dt, 0.14);
  camera.position.copy(camPos);
  camera.lookAt(tx,ty,tz);
  camera.updateMatrixWorld();

  /* --- uniform'ы моря --- */
  _pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  seaUniforms.iTime.value = time;
  seaUniforms.uCamPos.value.copy(camera.position);
  seaUniforms.uProjView.value.copy(_pv);
  seaUniforms.uInvProjView.value.copy(_pv).invert();

  renderer.clear(true,true,true);
  renderer.render(scene, camera);
  spdEl.textContent = (spd*3.5).toFixed(1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
