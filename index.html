<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seascape — Sailing Yacht</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #04121e;
            font-family: system-ui, Segoe UI, Roboto, sans-serif;
            color: #eaf3ff;
        }
        #gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
        .hud {
            position: fixed;
            left: 14px;
            top: 12px;
            padding: 12px 14px;
            background: rgba(4, 18, 30, .45);
            border: 1px solid rgba(140, 190, 230, .25);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            font-size: 13px;
            line-height: 1.5;
            max-width: 270px;
            user-select: none;
            pointer-events: none;
        }
        .hud b {
            color: #8fd0ff;
        }
        .key {
            display: inline-block;
            min-width: 16px;
            padding: 1px 6px;
            margin: 0 1px;
            border-radius: 5px;
            background: rgba(140, 190, 230, .18);
            border: 1px solid rgba(140, 190, 230, .35);
            font-size: 12px;
        }
        #speed {
            position: fixed;
            right: 16px;
            bottom: 16px;
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(4, 18, 30, .45);
            border: 1px solid rgba(140, 190, 230, .25);
            font-variant-numeric: tabular-nums;
            font-size: 14px;
            user-select: none;
            backdrop-filter: blur(6px);
        }
        #speed b {
            color: #8fd0ff;
            font-size: 20px;
        }
        #tag {
            position: fixed;
            left: 14px;
            bottom: 12px;
            font-size: 11px;
            opacity: .6;
            user-select: none;
        }
    </style>
</head>
<body>
    <canvas id="gl"></canvas>
    <div class="hud">
        <div style="font-size:15px;margin-bottom:6px"><b>⛵ Seascape Yacht</b></div>
        <span class="key">W</span>/<span class="key">↑</span> throttle up<br />
        <span class="key">S</span>/<span class="key">↓</span> reverse / brake<br />
        <span class="key">A</span>/<span class="key">←</span> turn left &nbsp;
        <span class="key">D</span>/<span class="key">→</span> turn right<br />
        <span class="key">drag</span> orbit camera &nbsp; <span class="key">wheel</span> zoom<br />
        <span class="key">R</span> reset position
        <div id="model" style="margin-top:6px;opacity:.75"></div>
    </div>
    <div id="speed">speed&nbsp; <b id="spd">0.0</b> kn</div>
    <div id="tag">Drop <b>yacht.glb</b> in the project folder to use your own model.</div>

    <!-- ============ SEA (raymarch) — RawShaderMaterial, GLSL3, writes gl_FragDepth ============ -->
    <script id="sea-vert" type="x-shader/x-vertex">
        in vec3 position;
        void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }
    </script>

    <script id="sea-frag" type="x-shader/x-fragment">
        precision highp float;
        out vec4 outColor;

        uniform vec2 uRes;
        uniform float iTime;
        uniform vec3 uCamPos;
        uniform mat4 uInvProjView;
        uniform mat4 uProjView;

        /* ===== Seascape by Alexander Alekseev aka TDM (2014), CC BY-NC-SA 3.0 ===== */
        const int NUM_STEPS = 32;
        const float PI = 3.141592;
        const float EPSILON = 1e-3;
#define EPSILON_NRM (0.1 / uRes.x)
        const int ITER_GEOMETRY = 3;
        const int ITER_FRAGMENT = 5;
        const float SEA_HEIGHT = 0.6;
        const float SEA_CHOPPY = 4.0;
        const float SEA_SPEED = 0.8;
        const float SEA_FREQ = 0.16;
        const vec3 SEA_BASE = vec3(0.0, 0.09, 0.18);
        const vec3 SEA_WATER_COLOR = vec3(0.8, 0.9, 0.6) * 0.6;
#define SEA_TIME (1.0 + iTime * SEA_SPEED)
        const mat2 octave_m = mat2(1.6, 1.2, -1.2, 1.6);

        float hash(vec2 p) { float h = dot(p, vec2(127.1, 311.7)); return fract(sin(h) * 43758.5453123); }
        float noise(in vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return -1.0 + 2.0 * mix(mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
                mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float diffuse(vec3 n, vec3 l, float p) { return pow(dot(n, l) * 0.4 + 0.6, p); }
        float specular(vec3 n, vec3 l, vec3 e, float s) { float nrm = (s + 8.0) / (PI * 8.0); return pow(max(dot(reflect(e, n), l), 0.0), s) * nrm; }
        vec3 getSkyColor(vec3 e) {
            e.y = (max(e.y, 0.0) * 0.8 + 0.2) * 0.8;
            return vec3(pow(1.0 - e.y, 2.0), 1.0 - e.y, 0.6 + (1.0 - e.y) * 0.4) * 1.1;
        }
        float sea_octave(vec2 uv, float choppy) {
            uv += noise(uv);
            vec2 wv = 1.0 - abs(sin(uv));
            vec2 swv = abs(cos(uv));
            wv = mix(wv, swv, wv);
            return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
        }
        float map(vec3 p) {
            float freq = SEA_FREQ,
                amp = SEA_HEIGHT,
                choppy = SEA_CHOPPY;
            vec2 uv = p.xz;
            uv.x *= 0.75;
            float d, h = 0.0;
            for (int i = 0; i < ITER_GEOMETRY; i++) {
                d = sea_octave((uv + SEA_TIME) * freq, choppy);
                d += sea_octave((uv - SEA_TIME) * freq, choppy);
                h += d * amp;
                uv *= octave_m;
                freq *= 1.9;
                amp *= 0.22;
                choppy = mix(choppy, 1.0, 0.2);
            }
            return p.y - h;
        }
        float map_detailed(vec3 p) {
            float freq = SEA_FREQ,
                amp = SEA_HEIGHT,
                choppy = SEA_CHOPPY;
            vec2 uv = p.xz;
            uv.x *= 0.75;
            float d, h = 0.0;
            for (int i = 0; i < ITER_FRAGMENT; i++) {
                d = sea_octave((uv + SEA_TIME) * freq, choppy);
                d += sea_octave((uv - SEA_TIME) * freq, choppy);
                h += d * amp;
                uv *= octave_m;
                freq *= 1.9;
                amp *= 0.22;
                choppy = mix(choppy, 1.0, 0.2);
            }
            return p.y - h;
        }
        vec3 getSeaColor(vec3 p, vec3 n, vec3 l, vec3 eye, vec3 dist) {
            float fresnel = clamp(1.0 - dot(n, -eye), 0.0, 1.0);
            fresnel = min(fresnel * fresnel * fresnel, 0.5);
            vec3 reflected = getSkyColor(reflect(eye, n));
            vec3 refracted = SEA_BASE + diffuse(n, l, 80.0) * SEA_WATER_COLOR * 0.12;
            vec3 color = mix(refracted, reflected, fresnel);
            float atten = max(1.0 - dot(dist, dist) * 0.001, 0.0);
            color += SEA_WATER_COLOR * (p.y - SEA_HEIGHT) * 0.18 * atten;
            color += specular(n, l, eye, 60.0);
            return color;
        }
        vec3 getNormal(vec3 p, float eps) {
            vec3 n;
            n.y = map_detailed(p);
            n.x = map_detailed(vec3(p.x + eps, p.y, p.z)) - n.y;
            n.z = map_detailed(vec3(p.x, p.y, p.z + eps)) - n.y;
            n.y = eps;
            return normalize(n);
        }
        float heightMapTracing(vec3 ori, vec3 dir, out vec3 p) {
            float tm = 0.0,
                tx = 1000.0;
            float hx = map(ori + dir * tx);
            if (hx > 0.0) { p = ori + dir * tx; return tx; }
            float hm = map(ori);
            for (int i = 0; i < NUM_STEPS; i++) {
                float tmid = mix(tm, tx, hm / (hm - hx));
                p = ori + dir * tmid;
                float hmid = map(p);
                if (hmid < 0.0) { tx = tmid;
                    hx = hmid; } else { tm = tmid;
                    hm = hmid; }
                if (abs(hmid) < EPSILON) break;
            }
            return mix(tm, tx, hm / (hm - hx));
        }

        void main() {
            vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
            vec4 wp = uInvProjView * vec4(ndc, 1.0, 1.0);
            vec3 farP = wp.xyz / wp.w;
            vec3 ori = uCamPos;
            vec3 dir = normalize(farP - ori);

            vec3 p;
            heightMapTracing(ori, dir, p);
            vec3 dist = p - ori;
            vec3 n = getNormal(p, dot(dist, dist) * EPSILON_NRM);
            vec3 light = normalize(vec3(0.0, 1.0, 0.8));

            vec3 color = mix(getSkyColor(dir),
                getSeaColor(p, n, light, dir, dist),
                pow(smoothstep(0.0, -0.02, dir.y), 0.2));

            // depth: sky -> far plane, water -> projected surface point
            float depth = 1.0;
            if (dir.y < 0.0) {
                vec4 c = uProjView * vec4(p, 1.0);
                depth = (c.z / c.w) * 0.5 + 0.5;
            }
            gl_FragDepth = clamp(depth, 0.0, 1.0);
            outColor = vec4(pow(color, vec3(0.65)), 1.0);
        }
    </script>

    <!-- ============ FOAM WAKE (flat ribbon on the surface, noise-based) ============ -->
    <script id="foam-vert" type="x-shader/x-vertex">
        attribute vec2 aData; // x = u across width (-1..1), y = age (0..1)
        varying vec2 vData;
        varying vec3 vWorld;
        void main() {
            vData = aData;
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorld = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
        }
    </script>
    <script id="foam-frag" type="x-shader/x-fragment">
        precision highp float;
        varying vec2 vData;
        varying vec3 vWorld;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
        float noise(vec2 p) {
            vec2 i = floor(p),
                f = fract(p);
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
        }
        float fbm(vec2 p) {
            float v = 0.0,
                a = 0.55;
            for (int i = 0; i < 4; i++) { v += a * noise(p);
                p = p * 2.02 + 1.7;
                a *= 0.5; }
            return v;
        }
        void main() {
            float u = vData.x; // -1..1 across the wake
            float age = vData.y; // 0..1 along its life

            // noise locked to WORLD position -> pattern looks painted onto the water
            float n = fbm(vWorld.xz * 1.7 + vec2(0.0, age * 1.5));
            n += 0.35 * fbm(vWorld.xz * 5.0 - vec2(age * 3.0, 0.0));

            // churn breaks up more (thinner) as the wake ages
            float thr = mix(0.30, 0.72, age);
            float churn = smoothstep(thr, thr + 0.30, n);

            // the two spreading edge lines of a wake are the foamiest, esp. when fresh
            float edge = smoothstep(0.55, 0.98, abs(u)) * (1.0 - smoothstep(0.0, 0.7, age));

            // soften the outer border so the ribbon has no hard cut
            float sideSoft = 1.0 - smoothstep(0.82, 1.0, abs(u));
            // fade in at the stern, out at the tail
            float ageFade = smoothstep(0.0, 0.06, age) * pow(1.0 - age, 1.25);

            float foam = clamp(churn * 0.85 + edge, 0.0, 1.0);
            float alpha = foam * sideSoft * ageFade * 0.9;
            if (alpha < 0.01) discard;

            vec3 col = mix(vec3(0.72, 0.83, 0.93), vec3(1.0), churn);
            gl_FragColor = vec4(col, alpha);
        }
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        /* ------------------------------ config ------------------------------ */
        const GLB_URL = 'yacht.glb';
        const GLB_TARGET_LENGTH = 3.6; // model is scaled so its longest axis = this
        const GLB_YAW_OFFSET = 0.0; // radians; set to Math.PI if your model faces -Z
        const QUALITY = 0.9; // render scale (lower = faster)

        /* ------------------------------ renderer ------------------------------ */
        const canvas = document.getElementById('gl');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2) * QUALITY);
        renderer.autoClear = false;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);

        /* ------------------------------ lights ------------------------------ */
        const sunDir = new THREE.Vector3(0, 1, 0.8).normalize();
        const sun = new THREE.DirectionalLight(0xfff4e2, 2.1);
        sun.position.copy(sunDir).multiplyScalar(50);
        scene.add(sun);
        scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x21506b, 0.9));
        scene.add(new THREE.AmbientLight(0x35506a, 0.5));

        /* ------------------------------ sea ------------------------------ */
        const seaUniforms = {
            uRes: { value: new THREE.Vector2() },
            iTime: { value: 0 },
            uCamPos: { value: new THREE.Vector3() },
            uInvProjView: { value: new THREE.Matrix4() },
            uProjView: { value: new THREE.Matrix4() },
        };
        const seaMat = new THREE.RawShaderMaterial({
            glslVersion: THREE.GLSL3,
            vertexShader: document.getElementById('sea-vert').textContent,
            fragmentShader: document.getElementById('sea-frag').textContent,
            uniforms: seaUniforms,
            depthTest: true,
            depthWrite: true,
        });
        const seaMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), seaMat);
        seaMesh.frustumCulled = false;
        seaMesh.renderOrder = -1;
        scene.add(seaMesh);

        /* ------------------------------ wave height (JS mirror of shader map) ------------------------------ */
        const fract = x => x - Math.floor(x);

        function hashJS(x, y) { return fract(Math.sin(x * 127.1 + y * 311.7) * 43758.5453123); }

        function noiseJS(x, y) {
            const ix = Math.floor(x),
                iy = Math.floor(y),
                fx = x - ix,
                fy = y - iy;
            const ux = fx * fx * (3 - 2 * fx),
                uy = fy * fy * (3 - 2 * fy);
            const a = hashJS(ix, iy),
                b = hashJS(ix + 1, iy),
                c = hashJS(ix, iy + 1),
                d = hashJS(ix + 1, iy + 1);
            const bx = a + (b - a) * ux,
                tx = c + (d - c) * ux;
            return -1 + 2 * (bx + (tx - bx) * uy);
        }

        function seaOctave(ux, uy, choppy) {
            const n = noiseJS(ux, uy);
            ux += n;
            uy += n;
            let wx = 1 - Math.abs(Math.sin(ux)),
                wy = 1 - Math.abs(Math.sin(uy));
            const sx = Math.abs(Math.cos(ux)),
                sy = Math.abs(Math.cos(uy));
            wx = wx + (sx - wx) * wx;
            wy = wy + (sy - wy) * wy;
            return Math.pow(1 - Math.pow(wx * wy, 0.65), choppy);
        }

        function seaHeightJS(x, z, time) {
            const SEA_TIME = 1 + time * 0.8;
            let freq = 0.16,
                amp = 0.6,
                choppy = 4.0;
            let ux = x * 0.75,
                uz = z,
                h = 0;
            for (let i = 0; i < 3; i++) {
                let d = seaOctave((ux + SEA_TIME) * freq, (uz + SEA_TIME) * freq, choppy);
                d += seaOctave((ux - SEA_TIME) * freq, (uz - SEA_TIME) * freq, choppy);
                h += d * amp;
                const nx = 1.6 * ux + 1.2 * uz,
                    nz = -1.2 * ux + 1.6 * uz;
                ux = nx;
                uz = nz;
                freq *= 1.9;
                amp *= 0.22;
                choppy = choppy + (1 - choppy) * 0.2;
            }
            return h;
        }

        /* ------------------------------ boat: procedural fallback ------------------------------ */
        function buildProceduralBoat() {
            const g = new THREE.Group();
            const white = new THREE.MeshStandardMaterial({ color: 0xeef2f6, roughness: 0.5, metalness: 0.05 });
            const red = new THREE.MeshStandardMaterial({ color: 0xb01f22, roughness: 0.5 });
            const teak = new THREE.MeshStandardMaterial({ color: 0x8a6a3f, roughness: 0.7 });
            const cabinM = new THREE.MeshStandardMaterial({ color: 0xd8dee6, roughness: 0.4, metalness: 0.1 });
            const spar = new THREE.MeshStandardMaterial({ color: 0x5b3f22, roughness: 0.6 });
            const sailM = new THREE.MeshStandardMaterial({ color: 0xf3f2ec, roughness: 0.85, side: THREE.DoubleSide });

            // hull (ellipsoid, flattened top) via scaled sphere then cut with deck box
            const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), white);
            hull.scale.set(0.5, 0.42, 1.75);
            g.add(hull);
            const boot = new THREE.Mesh(new THREE.SphereGeometry(1.005, 40, 10, 0, Math.PI * 2, Math.PI * 0.42, Math.PI *
                0.16), red);
            boot.scale.set(0.5, 0.42, 1.75);
            g.add(boot);
            const deck = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 2.6, 4, 16), teak);
            deck.rotation.x = Math.PI / 2;
            deck.position.y = 0.14;
            deck.scale.set(1.25, 1, 0.62);
            g.add(deck);
            // cabin
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.34, 1.1), cabinM);
            cabin.position.set(0, 0.32, -0.55);
            g.add(cabin);
            // mast + boom
            const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 2.0, 12), spar);
            mast.position.set(0, 1.05, 0.1);
            g.add(mast);
            const boom = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.7, 10), spar);
            boom.rotation.x = Math.PI / 2;
            boom.position.set(0, 0.42, -0.35);
            g.add(boom);
            // mainsail (curved plane)
            const mainGeo = new THREE.PlaneGeometry(1.1, 1.5, 12, 12);
            const mp = mainGeo.attributes.position;
            for (let i = 0; i < mp.count; i++) {
                const y = mp.getY(i),
                    x = mp.getX(i);
                const t = THREE.MathUtils.clamp((y + 0.75) / 1.5, 0, 1);
                mp.setZ(i, 0.28 * (1.0 - Math.pow((x / 0.55), 2)) * (0.6 + 0.4 * t));
            }
            mainGeo.computeVertexNormals();
            const mainsail = new THREE.Mesh(mainGeo, sailM);
            mainsail.rotation.y = Math.PI / 2;
            mainsail.position.set(0, 1.0, -0.3);
            g.add(mainsail);
            // jib
            const jib = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.0), sailM);
            jib.rotation.y = Math.PI / 2;
            jib.position.set(0, 0.75, 0.6);
            g.add(jib);

            g.traverse(o => { if (o.isMesh) { o.castShadow = false; } });
            return g;
        }

        let boat = buildProceduralBoat();
        scene.add(boat);
        const modelInfo = document.getElementById('model');
        modelInfo.innerHTML = 'model: <b>procedural</b>';

        /* ------------------------------ try to load yacht.glb ------------------------------ */
        (function tryLoadGLB() {
            const loader = new GLTFLoader();
            loader.load(GLB_URL, gltf => {
                const model = gltf.scene;
                // normalize: center + scale to target length + drop onto waterline
                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                const center = new THREE.Vector3();
                box.getCenter(center);
                const maxAxis = Math.max(size.x, size.y, size.z) || 1;
                const s = GLB_TARGET_LENGTH / maxAxis;
                model.position.sub(center); // center at origin
                const wrap = new THREE.Group();
                wrap.add(model);
                wrap.scale.setScalar(s);
                wrap.rotation.y = GLB_YAW_OFFSET;
                // recompute to sit its keel a touch below the waterline
                const box2 = new THREE.Box3().setFromObject(wrap);
                // ★★★★★ 修复：将模型底部抬升到水面以上 ★★★★★
                // 原来: wrap.position.y -= box2.min.y + 0.12;
                // 改为: 将模型底部对齐到 y = 0.15  (0.12 → 0.40 提升约0.28单位)
                const RAISE_AMOUNT = 5.40; // 增大此值可将模型抬得更高
                wrap.position.y -= box2.min.y + RAISE_AMOUNT;

                scene.remove(boat);
                boat = wrap;
                scene.add(boat);
                modelInfo.innerHTML = 'model: <b>yacht.glb</b> ✓';
                console.log('[yacht] loaded yacht.glb');
            }, undefined, err => {
                console.log('[yacht] yacht.glb not found — using procedural model.');
            });
        })();

        /* ------------------------------ foam wake (flat ribbon) ------------------------------ */
        const NSEG = 200; // max centreline samples
        const SAMPLE_STEP = 0.22; // distance between samples
        const WAKE_LIFE = 4.0; // seconds a sample stays alive
        const wakePos = new Float32Array(NSEG * 2 * 3);
        const wakeData = new Float32Array(NSEG * 2 * 2);
        const wakeIdx = new Uint32Array((NSEG - 1) * 6);
        for (let i = 0; i < NSEG - 1; i++) {
            const a = i * 2,
                b = i * 2 + 1,
                c = i * 2 + 2,
                d = i * 2 + 3,
                o = i * 6;
            wakeIdx[o] = a;
            wakeIdx[o + 1] = b;
            wakeIdx[o + 2] = c;
            wakeIdx[o + 3] = b;
            wakeIdx[o + 4] = d;
            wakeIdx[o + 5] = c;
        }
        const wakeGeo = new THREE.BufferGeometry();
        wakeGeo.setAttribute('position', new THREE.BufferAttribute(wakePos, 3).setUsage(THREE.DynamicDrawUsage));
        wakeGeo.setAttribute('aData', new THREE.BufferAttribute(wakeData, 2).setUsage(THREE.DynamicDrawUsage));
        wakeGeo.setIndex(new THREE.BufferAttribute(wakeIdx, 1));
        const foamMat = new THREE.ShaderMaterial({
            vertexShader: document.getElementById('foam-vert').textContent,
            fragmentShader: document.getElementById('foam-frag').textContent,
            transparent: true,
            depthWrite: false,
            depthTest: true,
            side: THREE.DoubleSide,
            blending: THREE.NormalBlending,
        });
        const foam = new THREE.Mesh(wakeGeo, foamMat);
        foam.frustumCulled = false;
        foam.renderOrder = 1;
        scene.add(foam);

        let wake = []; // centreline samples {x,z,px,pz,age}
        let lastSampleX = 0,
            lastSampleZ = 0;

        /* ------------------------------ controls ------------------------------ */
        const keys = {};
        addEventListener('keydown', e => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (e.code === 'KeyR') { B.x = 0;
                B.z = 0;
                B.speed = 0;
                B.heading = 0; }
        });
        addEventListener('keyup', e => { keys[e.code] = false; });

        let dragging = false,
            lastX = 0,
            lastY = 0;
        let camYaw = 0,
            camPitch = 0.32,
            camDist = 8.0;
        canvas.addEventListener('mousedown', e => { dragging = true;
            lastX = e.clientX;
            lastY = e.clientY; });
        addEventListener('mouseup', () => dragging = false);
        addEventListener('mousemove', e => {
            if (!dragging) return;
            camYaw -= (e.clientX - lastX) * 0.005;
            camPitch = Math.min(1.15, Math.max(-0.1, camPitch + (e.clientY - lastY) * 0.004));
            lastX = e.clientX;
            lastY = e.clientY;
        });
        canvas.addEventListener('wheel', e => { camDist = Math.min(18, Math.max(4, camDist + e.deltaY * 0.01));
            e.preventDefault(); }, { passive: false });

        /* ------------------------------ boat state + smoothing ------------------------------ */
        const B = {
            x: 0,
            z: 0,
            heading: 0,
            speed: 0,
            renderY: 0,
            pitch: 0,
            roll: 0
        }; // smoothed visual values
        const spdEl = document.getElementById('spd');
        const camPos = new THREE.Vector3(0, 5, 10);
        let camInit = false;

        // critically-smoothed exponential approach
        function damp(cur, target, dt, tau) { return cur + (target - cur) * (1 - Math.exp(-dt / tau)); }

        /* ------------------------------ resize ------------------------------ */
        function resize() {
            const w = innerWidth,
                h = innerHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            seaUniforms.uRes.value.set(canvas.width, canvas.height);
        }
        addEventListener('resize', resize);
        resize();

        /* ------------------------------ loop ------------------------------ */
        const _pv = new THREE.Matrix4();
        let t0 = performance.now(),
            last = t0;

        function frame(now) {
            const time = (now - t0) / 1000;
            let dt = (now - last) / 1000;
            last = now;
            dt = Math.min(dt, 0.05);

            /* --- physics --- */
            const turn = 1.35,
                accel = 3.0,
                maxFwd = 7.0,
                maxRev = 2.5;
            if (keys['ArrowLeft'] || keys['KeyA']) B.heading += turn * dt;
            if (keys['ArrowRight'] || keys['KeyD']) B.heading -= turn * dt;
            if (keys['ArrowUp'] || keys['KeyW']) B.speed += accel * dt;
            else if (keys['ArrowDown'] || keys['KeyS']) B.speed -= accel * dt;
            else B.speed *= (1 - 1.1 * dt);
            B.speed = Math.min(maxFwd, Math.max(-maxRev, B.speed));
            B.x += Math.sin(B.heading) * B.speed * dt;
            B.z += Math.cos(B.heading) * B.speed * dt;

            /* --- wave-riding targets (sampled over a footprint, then smoothed in time) --- */
            const e = 0.55;
            const hC = seaHeightJS(B.x, B.z, time);
            const hF = seaHeightJS(B.x + Math.sin(B.heading) * e, B.z + Math.cos(B.heading) * e, time);
            const hB = seaHeightJS(B.x - Math.sin(B.heading) * e, B.z - Math.cos(B.heading) * e, time);
            const rX = Math.cos(B.heading),
                rZ = -Math.sin(B.heading); // starboard vector
            const hR = seaHeightJS(B.x + rX * e, B.z + rZ * e, time);
            const hL = seaHeightJS(B.x - rX * e, B.z - rZ * e, time);
            const targetY = (hC + (hF + hB + hR + hL) * 0.25) * 0.5; // averaged height
            const targetPitch = Math.atan2(hB - hF, 2 * e); // nose follows swell
            const targetRoll = Math.atan2(hR - hL, 2 * e);

            // temporal smoothing removes the jitter
            B.renderY = damp(B.renderY, targetY, dt, 0.16);
            B.pitch = damp(B.pitch, targetPitch, dt, 0.18);
            B.roll = damp(B.roll, targetRoll, dt, 0.18);
            // gentle idle bob so it never looks frozen
            const bob = Math.sin(time * 1.1) * 0.015;

            boat.position.set(B.x, B.renderY - 0.06 + bob, B.z);
            boat.rotation.set(0, 0, 0);
            boat.rotation.order = 'YXZ';
            boat.rotation.y = B.heading;
            boat.rotation.x = B.pitch;
            boat.rotation.z = B.roll;

            /* --- foam wake (flat ribbon that sits on the water) --- */
            const spd = Math.abs(B.speed);
            // point behind the transom where the wake is born
            const sternX = B.x - Math.sin(B.heading) * 1.55;
            const sternZ = B.z - Math.cos(B.heading) * 1.55;
            if (spd > 0.4) {
                const ddx = sternX - lastSampleX,
                    ddz = sternZ - lastSampleZ;
                if (ddx * ddx + ddz * ddz > SAMPLE_STEP * SAMPLE_STEP) {
                    wake.push({ x: sternX, z: sternZ, px: rX, pz: rZ, age: 0 });
                    lastSampleX = sternX;
                    lastSampleZ = sternZ;
                    if (wake.length > NSEG) wake.shift();
                }
            }
            // age samples and drop dead ones (oldest are at the front)
            for (let i = 0; i < wake.length; i++) wake[i].age += dt / WAKE_LIFE;
            while (wake.length && wake[0].age >= 1) wake.shift();

            // rebuild ribbon vertices: two per sample, laid flat on the wave surface
            const count = wake.length;
            for (let i = 0; i < count; i++) {
                const sm = wake[i];
                const hw = 0.30 + sm.age * 2.4; // wake widens with age (Kelvin V)
                const lx = sm.x - sm.px * hw,
                    lz = sm.z - sm.pz * hw;
                const rx = sm.x + sm.px * hw,
                    rz = sm.z + sm.pz * hw;
                const li = (i * 2) * 3,
                    ri = (i * 2 + 1) * 3;
                wakePos[li] = lx;
                wakePos[li + 1] = seaHeightJS(lx, lz, time) + 0.05;
                wakePos[li + 2] = lz;
                wakePos[ri] = rx;
                wakePos[ri + 1] = seaHeightJS(rx, rz, time) + 0.05;
                wakePos[ri + 2] = rz;
                const ld = (i * 2) * 2,
                    rd = (i * 2 + 1) * 2;
                wakeData[ld] = -1;
                wakeData[ld + 1] = sm.age;
                wakeData[rd] = 1;
                wakeData[rd + 1] = sm.age;
            }
            wakeGeo.attributes.position.needsUpdate = true;
            wakeGeo.attributes.aData.needsUpdate = true;
            wakeGeo.setDrawRange(0, Math.max(0, count - 1) * 6);

            /* --- chase camera (smoothed) --- */
            const tx = B.x,
                ty = B.renderY + 0.55,
                tz = B.z;
            const yaw = B.heading + Math.PI + camYaw;
            const cp = Math.cos(camPitch);
            const desired = new THREE.Vector3(
                tx + Math.sin(yaw) * cp * camDist,
                ty + Math.sin(camPitch) * camDist + 0.6,
                tz + Math.cos(yaw) * cp * camDist
            );
            if (!camInit) { camPos.copy(desired);
                camInit = true; }
            camPos.x = damp(camPos.x, desired.x, dt, 0.14);
            camPos.y = damp(camPos.y, desired.y, dt, 0.14);
            camPos.z = damp(camPos.z, desired.z, dt, 0.14);
            camera.position.copy(camPos);
            camera.lookAt(tx, ty, tz);
            camera.updateMatrixWorld();

            /* --- sea uniforms --- */
            _pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            seaUniforms.iTime.value = time;
            seaUniforms.uCamPos.value.copy(camera.position);
            seaUniforms.uProjView.value.copy(_pv);
            seaUniforms.uInvProjView.value.copy(_pv).invert();

            /* --- render --- */
            renderer.clear(true, true, true);
            renderer.render(scene, camera);

            spdEl.textContent = (spd * 3.5).toFixed(1);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>
</html>
