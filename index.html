<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лодка с отражением в raymarch-воде</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

// --- Инициализация сцены ---
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(5, 3, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// --- HDRI окружение ---
const rgbeLoader = new RGBELoader();
rgbeLoader.load('sunset.hdr', (texture) => {
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
    scene.background = texture;
    applyEnvMapToBoat();
}, undefined, (err) => {
    console.warn('HDRI not loaded, using fallback sky');
    scene.background = new THREE.Color(0x87CEEB);
});

// --- Вспомогательный свет (если нет HDRI) ---
const ambientLight = new THREE.AmbientLight(0x404060);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.5);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

// --- Лодка (загружаем модель) ---
let boat = null;
const loader = new GLTFLoader();
loader.load('boat.glb', (gltf) => {
    boat = gltf.scene;
    boat.scale.set(0.5, 0.5, 0.5);
    boat.position.y = 0.2;
    scene.add(boat);
    applyEnvMapToBoat();
}, undefined, (err) => {
    console.warn('boat.glb not found, creating procedural boat');
    createProceduralBoat();
});

function applyEnvMapToBoat() {
    if (!boat || !scene.environment) return;
    boat.traverse((child) => {
        if (child.isMesh) {
            child.material.envMap = scene.environment;
            child.material.envMapIntensity = 1.2;
            child.material.metalness = 0.7;
            child.material.roughness = 0.3;
            child.material.needsUpdate = true;
        }
    });
}

// Запасная procedural лодка
function createProceduralBoat() {
    const group = new THREE.Group();
    // Корпус
    const hullGeo = new THREE.BoxGeometry(1.5, 0.4, 3);
    const hullMat = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.5, metalness: 0.2 });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    hull.position.y = 0.2;
    group.add(hull);
    // Палуба
    const deckGeo = new THREE.BoxGeometry(1.2, 0.1, 2.5);
    const deckMat = new THREE.MeshStandardMaterial({ color: 0xD2B48C, roughness: 0.8 });
    const deck = new THREE.Mesh(deckGeo, deckMat);
    deck.position.set(0, 0.4, 0);
    group.add(deck);
    // Мачта
    const mastGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5);
    const mastMat = new THREE.MeshStandardMaterial({ color: 0x654321 });
    const mast = new THREE.Mesh(mastGeo, mastMat);
    mast.position.set(0, 1.0, -0.5);
    group.add(mast);
    // Парус
    const sailGeo = new THREE.PlaneGeometry(0.8, 1.0);
    const sailMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, side: THREE.DoubleSide });
    const sail = new THREE.Mesh(sailGeo, sailMat);
    sail.position.set(0, 1.0, -0.5);
    sail.rotation.y = 0.2;
    group.add(sail);
    
    boat = group;
    boat.position.y = 0.2;
    scene.add(boat);
    applyEnvMapToBoat();
}

// --- Вода (raymarch шейдер) ---
const seaUniforms = {
    uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    iTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
    uInvProjView: { value: new THREE.Matrix4() },
    uProjView: { value: new THREE.Matrix4() },
    uReflectionTex: { value: null }
};

const seaVertexShader = `
    varying vec2 vUv;
    void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
`;

const seaFragmentShader = `
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uRes;
    uniform float iTime;
    uniform vec3 uCamPos;
    uniform mat4 uInvProjView;
    uniform mat4 uProjView;
    uniform sampler2D uReflectionTex;

    // --- Raymarch water functions ---
    float sea_octave(vec2 uv, float choppy) {
        uv += noise(uv);
        vec2 wv = 1.0 - abs(sin(uv));
        vec2 swv = abs(cos(uv));
        wv = mix(wv, swv, wv);
        return pow(1.0 - pow(wv.x * wv.y, 0.65), choppy);
    }

    float map(vec3 p) {
        float freq = 0.16;
        float amp = 0.6;
        float choppy = 4.0;
        vec2 uv = p.xz * freq;
        float wave = 0.0;
        for (int i = 0; i < 5; i++) {
            wave += sea_octave(uv + iTime * 0.4, choppy) * amp;
            uv *= 2.0;
            amp *= 0.5;
            choppy = mix(choppy, 1.0, 0.2);
        }
        return p.y - wave;
    }

    vec3 getSkyColor(vec3 dir) {
        float y = max(dir.y, 0.0);
        vec3 col = mix(vec3(0.3, 0.5, 0.8), vec3(0.9, 0.9, 0.9), pow(y, 0.5));
        // Солнце
        vec3 sunDir = normalize(vec3(1.0, 0.5, 0.5));
        float sun = pow(max(dot(dir, sunDir), 0.0), 100.0);
        col += sun * vec3(1.0, 0.8, 0.5);
        return col;
    }

    vec3 getSeaColor(vec3 p, vec3 n, vec3 light, vec3 eye, vec3 dist) {
        float fresnel = 1.0 - max(dot(n, -eye), 0.0);
        fresnel = pow(fresnel, 3.0) * 0.5;

        // Отражение неба
        vec3 reflected = getSkyColor(reflect(eye, n));
        // Преломление (глубина)
        vec3 refracted = vec3(0.02, 0.04, 0.06) + vec3(0.0, 0.1, 0.2) * (1.0 - fresnel);

        vec3 color = mix(refracted, reflected, fresnel);

        // Блик
        float spec = pow(max(dot(light, reflect(eye, n)), 0.0), 120.0);
        color += spec * vec3(1.0, 0.9, 0.7) * 0.6;

        // Пена на гребнях
        float foam = smoothstep(0.7, 1.0, map(p));
        color = mix(color, vec3(1.0), foam * 0.3);

        return color;
    }

    void main() {
        vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
        vec3 ro = uCamPos;
        vec3 rd = normalize(vec3(uv, -1.0)); // простой вид, для точности нужно из матрицы

        // Более точный луч из камеры (используем uInvProjView)
        vec4 clipPos = vec4(uv * vec2(1.0, -1.0), -1.0, 1.0);
        vec4 viewPos = uInvProjView * clipPos;
        viewPos /= viewPos.w;
        rd = normalize(viewPos.xyz - ro);

        // Raymarch
        float t = 0.0;
        float d = 0.0;
        vec3 p;
        for (int i = 0; i < 60; i++) {
            p = ro + rd * t;
            d = map(p);
            if (d < 0.001 || t > 50.0) break;
            t += d * 0.5;
        }

        vec3 color;
        if (d < 0.001) {
            // Вычисляем нормаль
            vec2 eps = vec2(0.001, 0.0);
            vec3 n = normalize(vec3(
                map(p + eps.xyy) - map(p - eps.xyy),
                map(p + eps.yxy) - map(p - eps.yxy),
                map(p + eps.yyx) - map(p - eps.yyx)
            ));
            vec3 light = normalize(vec3(1.0, 0.5, 0.5));
            color = getSeaColor(p, n, light, rd, p - ro);

            // --- Отражение лодки (из текстуры) ---
            if (rd.y < 0.0) {
                vec3 reflDir = reflect(rd, n);
                // Искажение от волн
                float distort = sea_octave(p.xz * 1.8, 1.0) * 0.03;
                vec2 reflUV = gl_FragCoord.xy / uRes;
                reflUV += distort * n.xz;
                vec3 reflColor = texture(uReflectionTex, reflUV).rgb;
                // Усиление бликов
                float spec = pow(max(0.0, dot(reflDir, light)), 24.0);
                reflColor += spec * 0.8;
                // Смешивание по Френелю
                float fresnel = 1.0 - max(dot(n, -rd), 0.0);
                fresnel = pow(fresnel, 3.0) * 0.6;
                float blend = min(fresnel * 2.5, 0.9);
                color = mix(color, reflColor, blend);
            }
        } else {
            color = getSkyColor(rd);
        }

        // Туман
        color = mix(color, vec3(0.7, 0.8, 0.9), 1.0 - exp(-t * 0.01));

        gl_FragColor = vec4(color, 1.0);
    }
`;

const seaMaterial = new THREE.ShaderMaterial({
    uniforms: seaUniforms,
    vertexShader: seaVertexShader,
    fragmentShader: seaFragmentShader,
    side: THREE.DoubleSide,
    transparent: false,
});

const seaGeometry = new THREE.PlaneGeometry(60, 60);
const seaMesh = new THREE.Mesh(seaGeometry, seaMaterial);
seaMesh.rotation.x = -Math.PI / 2;
seaMesh.position.y = 0;
scene.add(seaMesh);

// --- Отражение (render target) ---
const reflectionTarget = new THREE.WebGLRenderTarget(
    window.innerWidth * 0.5,
    window.innerHeight * 0.5,
    { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat }
);
const reflectionCamera = camera.clone();
reflectionCamera.matrixAutoUpdate = false;

// --- Анимация ---
let lastTime = 0;
function animate(time) {
    requestAnimationFrame(animate);
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    // Обновляем время в шейдере воды
    seaUniforms.iTime.value += dt;

    // --- Обновление лодки (простое покачивание) ---
    if (boat) {
        // Простая имитация волн
        const waveY = Math.sin(time * 0.003 + 1.0) * 0.05;
        const waveRotX = Math.sin(time * 0.002) * 0.02;
        const waveRotZ = Math.cos(time * 0.0025) * 0.03;
        boat.position.y = 0.2 + waveY;
        boat.rotation.x = waveRotX;
        boat.rotation.z = waveRotZ;
    }

    // --- Рендер отражения ---
    const waterLevel = 0;
    if (boat) {
        const savedBoatY = boat.position.y;
        const savedBoatRot = boat.rotation.clone();

        // Отражаем лодку под воду
        boat.position.y = waterLevel - (savedBoatY - waterLevel);
        boat.rotation.x = -savedBoatRot.x;
        boat.rotation.z = -savedBoatRot.z;

        // Отражаем камеру
        const camPos = camera.position.clone();
        reflectionCamera.position.set(camPos.x, waterLevel - (camPos.y - waterLevel), camPos.z);
        reflectionCamera.rotation.copy(camera.rotation);
        reflectionCamera.rotation.x = -reflectionCamera.rotation.x;
        reflectionCamera.updateMatrixWorld(true);

        // Рендерим без воды
        const waterVisible = seaMesh.visible;
        seaMesh.visible = false;
        renderer.setRenderTarget(reflectionTarget);
        renderer.render(scene, reflectionCamera);
        renderer.setRenderTarget(null);
        seaMesh.visible = waterVisible;

        // Возвращаем лодку
        boat.position.y = savedBoatY;
        boat.rotation.copy(savedBoatRot);
    }

    // --- Обновляем uniform'ы воды ---
    seaUniforms.uCamPos.value.copy(camera.position);
    seaUniforms.uProjView.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    seaUniforms.uInvProjView.value.copy(seaUniforms.uProjView.value).invert();
    seaUniforms.uReflectionTex.value = reflectionTarget.texture;

    // --- Рендер основной сцены ---
    renderer.render(scene, camera);
}

animate(0);

// --- Resize ---
window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    seaUniforms.uRes.value.set(w, h);
    reflectionTarget.setSize(w * 0.5, h * 0.5);
});

// --- OrbitControls (для отладки) ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.update();
</script>
</body>
</html>
